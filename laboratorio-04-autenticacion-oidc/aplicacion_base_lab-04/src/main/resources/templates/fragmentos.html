<!DOCTYPE html>
<!--
  Fragmentos reutilizables de Thymeleaf.
  Se incluyen desde publica.html y privada.html con th:replace.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Cabecera común. Muestra la navegación y la identidad del visitante.

  LABORATORIO 04: "usuario" contiene el nombre del usuario autenticado en
  Keycloak, o "anónimo". Si no hay sesión se ofrece el enlace de inicio.
  La ruta /oauth2/authorization/keycloak la crea Spring Security: al
  visitarla, redirige al usuario a la pantalla de login de Keycloak.
  LABORATORIO 05: aquí se añadirá el botón de cerrar sesión.
-->
<header th:fragment="cabecera" class="cabecera">
    <a class="marca" th:href="@{/}">Cooperativa Andina</a>
    <nav>
        <a th:href="@{/}">Portada</a>
        <a th:href="@{/privada}">Clientes</a>
    </nav>
    <span class="identidad">
        Sesión: <strong th:text="${usuario}">anónimo</strong>
        <a th:unless="${autenticado}" th:href="@{/oauth2/authorization/keycloak}">Iniciar sesión</a>
    </span>
</header>

<!-- Pie común -->
<footer th:fragment="pie" class="pie">
    Aplicación base del curso · Desarrollo seguro con Keycloak
</footer>

</body>
</html>
