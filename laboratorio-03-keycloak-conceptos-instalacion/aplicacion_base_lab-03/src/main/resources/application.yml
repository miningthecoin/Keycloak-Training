# Configuración de la aplicación base.
#
# Keycloak (start-dev) escucha en el puerto 8080, por lo que la aplicación
# usa el 8081 para que ambos convivan en la misma máquina virtual WSL.

server:
  port: 8081

spring:
  application:
    name: aplicacion-base
  thymeleaf:
    # Desactiva la caché de plantillas para ver cambios sin reiniciar
    cache: false

